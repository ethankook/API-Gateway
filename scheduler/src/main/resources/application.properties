spring.application.name=scheduler

server.port=9191

# --- Database (Postgres) ---
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:4432}/${DB_NAME:orchard}?currentSchema=scheduler
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# --- JPA/Hibernate ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.default_schema=scheduler

spring.flyway.enabled=true
spring.flyway.schemas=scheduler
spring.flyway.locations=classpath:db/migration
spring.flyway.create-schemas=true


# --- Scheduler ---
scheduler.require-authenticated-caller=true
scheduler.poll-interval-ms=100
scheduler.executor-core-pool-size=10
scheduler.executor-max-pool-size=20
scheduler.batch-size=10
scheduler.stuck-job-threshold-minutes=5
scheduler.http-client.connect-timeout-ms: 5000
scheduler.http-client.read-timeout-ms: 30000
scheduler.http-client.max-connections: 50

spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]
