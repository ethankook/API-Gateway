spring.application.name=gateway

server.port=9090
logging.pattern.console="%d{HH:mm:ss} [%X{requestId}] %-5level %logger{36} - %msg%n"

# --- Routes ---
gateway.routes[0].routeId=scheduler-service
gateway.routes[0].pathPrefix=/api/v1/jobs
gateway.routes[0].downstreamUrl=${SCHEDULER_URL:http://localhost:9191}/api/v1/jobs
gateway.routes[0].requiresAuth=true
gateway.routes[0].requiresInternalToken=true
gateway.routes[0].methods[0]=POST
gateway.routes[0].methods[1]=GET
gateway.routes[0].methods[2]=DELETE

# --- JWT Secret Key ---
auth.jwt.secret=${JWT_SECRET_KEY}

# --- JWT Issuer ---
auth.jwt.issuer=Orchard

# --- Timeouts ---
gateway.connect-timeout-ms=3000
gateway.read-timeout-ms=10000
gateway.internal-token=${GATEWAY_INTERNAL_TOKEN:}

# --- Rate Limiting ---
rate-limiting.default-capacity=20
rate-limiting.default-refill-rate=2

spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]
